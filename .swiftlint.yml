# Lint project-owned Swift only. Dependencies and generated build products are
# validated by their upstream projects and otherwise overwhelm local results.
included:
  - Package.swift
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - Vendor
  - website-prototype
  - Sources/EasyTierMac/Resources

baseline: .swiftlint-baseline.json

only_rules:
  # Correctness and safety
  - async_without_await
  - block_based_kvo
  - compiler_protocol_init
  - discarded_notification_center_observer
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - force_cast
  - force_try
  - force_unwrapping
  - identical_operands
  - incompatible_concurrency_annotation
  - invalid_swiftlint_command
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - overridden_super_call
  - prohibited_super_call
  - self_in_property_initialization
  - unhandled_throwing_task
  - unavailable_condition
  - unowned_variable_capture
  - unused_import
  - valid_ibinspectable

  # Performance and modern Swift
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - is_disjoint
  - last_where
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_multiple
  - reduce_boolean
  - reduce_into
  - sorted_first_last
  - toggle_bool

  # Readability with a deliberately migration-friendly baseline
  - blanket_disable_command
  - closing_brace
  - closure_parameter_position
  - colon
  - comma
  - comment_spacing
  - control_statement
  - custom_rules
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - file_length
  - function_body_length
  - function_name_whitespace
  - function_parameter_count
  - generic_type_name
  - implicit_getter
  - leading_whitespace
  - line_length
  - mark
  - opening_brace
  - private_over_fileprivate
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - implicit_optional_initialization
  - redundant_type_annotation
  - return_arrow_whitespace
  - statement_position
  - syntactic_sugar
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length
  - type_name
  - unneeded_break_in_switch
  - unused_closure_parameter
  - unused_control_flow_label
  - vertical_parameter_alignment
  - void_return
  - weak_delegate
  - yoda_condition

file_length:
  warning: 900
  error: 1400
  ignore_comment_only_lines: true

type_body_length:
  warning: 500
  error: 800

function_body_length:
  warning: 100
  error: 180

function_parameter_count:
  warning: 7
  error: 9

line_length:
  warning: 140
  error: 220
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 64

generic_type_name:
  min_length: 1
  max_length:
    warning: 32
    error: 48

force_cast: warning
force_try: warning
force_unwrapping: warning

custom_rules:
  no_dispatch_main_async:
    name: "Use Swift Concurrency"
    regex: 'DispatchQueue\.main\.async'
    message: "Use MainActor or an async MainActor method instead of DispatchQueue.main.async."
    severity: error

  no_nanosecond_sleep:
    name: "Use Duration Sleep"
    regex: 'Task\.sleep\s*\(\s*nanoseconds:'
    message: "Use Task.sleep(for:) with Duration."
    severity: error

  no_foreground_color:
    name: "Use foregroundStyle"
    regex: '\.foregroundColor\s*\('
    message: "Use foregroundStyle() in SwiftUI code."
    severity: warning

  no_swiftui_corner_radius:
    name: "Use clipShape"
    regex: '\.cornerRadius\s*\('
    message: "Use clipShape(.rect(cornerRadius:)) in SwiftUI code."
    severity: warning

  no_legacy_observation:
    name: "Use Observation"
    regex: '\b(ObservableObject|@Published|@StateObject|@ObservedObject|@EnvironmentObject)\b'
    message: "Prefer @Observable with @State, @Bindable, or @Environment."
    severity: warning
